spring:
  application:
    name: commerceplus
  cache:
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s

  datasource:
    url: jdbc:mysql://localhost:3306/commerceplus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

#  thymeleaf:
#    cache: false
#    prefix: classpath:/templates/
#    suffix: .html

server:
  port: 8080

