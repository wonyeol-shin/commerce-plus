version: '3.8'

services:
  # 1. MySQL 데이터베이스 컨테이너
  database:
    image: mysql:8.0
    container_name: plus-commerce-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: commerceplus
      MYSQL_ROOT_PASSWORD: ${DB_USER_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network

  # 2. 스프링 부트 (리액트 내장) 컨테이너
  backend:
    build: .
    container_name: plus-commerce-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_USERNAME=${DB_USER_USERNAME}
      - DB_PASSWORD=${DB_USER_PASSWORD}
    depends_on:
      - database
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  db_data:
